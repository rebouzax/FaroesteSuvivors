<!doctype html><html><meta charset="utf-8"><title>Orientação de criaturas</title><body style="margin:0;background:#222;color:white"><p>Modelos: original (esquerda), preparado para o jogo (direita). Seta azul = frente esperada (+Z).</p><script type="module">
import * as T from 'three';
import {clone} from 'three/addons/utils/SkeletonUtils.js';
import {loadSupplied,loadActor,normalizeModel} from './src/views/SuppliedAssetLoader.js';
const scene=new T.Scene();scene.background=new T.Color('#555555');scene.add(new T.HemisphereLight(0xffffff,0x777777,3));const light=new T.DirectionalLight(0xffffff,3);light.position.set(2,8,4);scene.add(light);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(1000,700);document.body.append(renderer.domElement);const camera=new T.OrthographicCamera(-6,6,4.2,-4.2,.1,100);camera.position.set(0,10,0);camera.up.set(0,0,-1);camera.lookAt(0,0,0);
for(const [row,id] of ['lobo','scropiao'].entries())for(let col=0;col<2;col++){
const model=col?clone((await loadActor(id,id==='lobo'?'quadruped':'arthropod')).scene):normalizeModel((await loadSupplied(id)).scene,2,'width');model.position.set(col*4-2,0,row*4-2);scene.add(model);scene.add(new T.ArrowHelper(new T.Vector3(0,0,1),new T.Vector3(col*4-2,.05,row*4-2),1.8,0x00aaff));
}renderer.render(scene,camera);
const button=document.createElement('button');button.textContent='Ver oito direções com animação';document.body.prepend(button);
button.onclick=async()=>{
 const {EnemyAssetView}=await import('./src/views/EnemyAssetView.js');
 const {animateEnemyHigh,resetEnemyHigh}=await import('./src/views/HighQualityEnemyAnimation.js');
 for(const child of [...scene.children])if(!child.isLight)scene.remove(child);
 camera.left=-9;camera.right=9;camera.top=6.3;camera.bottom=-6.3;camera.updateProjectionMatrix();
 const factory=new EnemyAssetView(),views=[];
 for(const [col,type] of ['ridgeWolf','redScorpion'].entries()){
  const center=col?4.5:-4.5,target=new T.Mesh(new T.SphereGeometry(.2),new T.MeshBasicMaterial({color:0xff2222}));target.position.set(center,0,0);scene.add(target);
  for(let i=0;i<8;i++){
   const a=i*Math.PI/4,x=center+Math.sin(a)*3,z=Math.cos(a)*3,view=factory.create(type);await view.userData.ready;view.position.set(x,0,z);view.rotation.y=Math.atan2(center-x,-z);scene.add(view);
   view.add(new T.ArrowHelper(new T.Vector3(0,0,1),new T.Vector3(0,.02,0),1.3,0x00aaff));views.push({view,enemy:{id:i,x,z,speed:3}});
  }
 }
 document.querySelector('p').textContent='Lobos à esquerda, escorpiões à direita: mirando os alvos vermelhos em oito direções.';
 button.textContent='Alternar normal / alta';let high=true;button.onclick=()=>{high=!high;button.textContent='Qualidade: '+(high?'alta':'normal');};
 let last=performance.now();function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;for(const {view,enemy} of views){resetEnemyHigh(view);view.userData.mixer?.update(dt);if(high)animateEnemyHigh(view,enemy,now/1000,dt);}renderer.render(scene,camera);requestAnimationFrame(tick);}requestAnimationFrame(tick);
};
</script></body></html>

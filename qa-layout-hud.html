<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisão de cenários e HUD</title>
<link rel="stylesheet" href="./src/styles/menu.css"><link rel="stylesheet" href="./src/styles/game.css"><link rel="stylesheet" href="./src/styles/version03.css"><link rel="stylesheet" href="./src/styles/version04.css"><link rel="stylesheet" href="./src/styles/version06.css"><link rel="stylesheet" href="./src/styles/version06-polish.css"><link rel="stylesheet" href="./src/styles/version06-fixes.css"><link rel="stylesheet" href="./src/styles/version07.css"><link rel="stylesheet" href="./src/styles/version07-expansion.css"><link rel="stylesheet" href="./src/styles/version07-night.css">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#app{position:absolute;inset:0;width:100%;height:100%;max-width:none}#qa{position:fixed;bottom:8px;left:8px;z-index:999;display:flex;gap:8px;background:#222c;padding:5px;font:12px sans-serif;color:white}#qa select,#qa button{font:12px sans-serif;padding:4px;min-height:0}</style>
<main id="app"></main><aside id="qa"><select aria-label="Fase"></select><button id="boss">Chefe: 50% vida</button><button id="quality">Alternar qualidade</button><span id="status"></span></aside>
<script type="module">
import {ScreenView} from './src/views/ScreenView.js';import {GameView} from './src/views/GameView.js';import {RunModel} from './src/models/RunModel.js';import {RunSystem} from './src/systems/RunSystem.js';import {WeatherSystem} from './src/systems/WeatherSystem.js';import {MAPS} from './src/config/mapConfig.js';import {CAMPAIGN,ENEMY_STAGE_GROUPS} from './src/config/campaignConfig.js';import {enemyStats} from './src/config/abilityConfig.js';
import {EnemySystem} from './src/systems/EnemySystem.js';
let live=false;const enemies=new EnemySystem(),demo=document.createElement('button');demo.textContent='Testar machados';document.querySelector('#qa').append(demo);
demo.onclick=()=>{live=!live;run.enemies=[{id:500,type:'headlessOutlaw',...enemyStats('headlessOutlaw',0),maxHp:200,x:2,z:0,hitFlash:0,shotTimer:0}];run.spawnTimer=run.specialSpawnTimer=run.dogTimer=run.skeletonTimer=9999;run.player.hp=run.player.maxHp;};
const screen=new ScreenView(document.querySelector('#app'),()=>{},()=>{}),select=document.querySelector('select'),keys=new Set(),move=new RunSystem();let run,view,frame,quality='high';
select.innerHTML=Object.entries(MAPS).map(([id,m])=>`<option value="${id}">${m.name}</option>`).join('');
addEventListener('keydown',e=>keys.add(e.key));addEventListener('keyup',e=>keys.delete(e.key));
async function start(){cancelAnimationFrame(frame);view?.dispose();run=new RunModel(()=>.5,0,{}, {mapId:select.value,mode:'story'});run.phase='playing';run.weather.nextAt=9999;run.player.level=7;run.player.xp=40;run.coins=1250;run.time=180;
run.enemies=ENEMY_STAGE_GROUPS[run.mapId].filter(t=>t!=='vulture').map((type,i)=>({id:i+1,type,...enemyStats(type,0),maxHp:600,x:(i-1.5)*3,z:0,hitFlash:0}));
const {host}=screen.game(run,'pt');view=new GameView(host,run,{quality});await view.suppliedScenery.ready;document.querySelector('#status').textContent=quality+' · '+view.suppliedScenery.failures.length+' falhas · use as setas';let last=performance.now();
function tick(now){const dt=Math.min(.04,(now-last)/1000);last=now;run.visualTime+=dt;move.move(run,dt,{x:Number(keys.has('ArrowRight'))-Number(keys.has('ArrowLeft')),z:Number(keys.has('ArrowDown'))-Number(keys.has('ArrowUp'))});new WeatherSystem().update(run,dt);if(live){run.player.invulnerable=10;enemies.update(run,dt);document.querySelector('#status').textContent='Projéteis: '+run.enemyShots.map(s=>s.kind).join(', ');if(run.enemyShots.some(s=>s.kind==='axe')){enemies.updateShots(run,.25);live=false;document.querySelector('#status').textContent='Arremesso verificado: machado';}}view.render(run);screen.updateHud(run,'pt');frame=requestAnimationFrame(tick);}frame=requestAnimationFrame(tick);}
select.onchange=start;document.querySelector('#quality').onclick=()=>{quality=quality==='high'?'normal':'high';start();};document.querySelector('#boss').onclick=()=>{const b=CAMPAIGN[run.mapId].bosses[0];run.enemies.push({...b,id:100,bossId:b.id,x:4,z:4,maxHp:b.hp,hp:b.hp*.5,hitFlash:0});run.bossEncounter.active=true;run.bossEncounter.bossId=b.id;};await start();
</script></html>
